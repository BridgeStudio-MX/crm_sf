name: Deploy to droplet

# Despliega en cada push a main. El build pesado (frontend + imagen Docker)
# corre aqui, en los runners de GitHub (con RAM de sobra). El droplet solo
# hace pull de la imagen ya construida y reinicia los contenedores.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pre-construir el frontend en el runner (tiene RAM de sobra). El Dockerfile
      # detecta packages/twenty-front/build/ y se salta el build pesado en Docker.
      - name: Build frontend
        run: |
          corepack enable
          yarn install --immutable
          npx nx run twenty-front:lingui:compile
          npx nx build twenty-front
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # Público vía Caddy → container parks (:3002)
          VITE_PARKS_SERVICE_URL: https://parks.bridgehub.mx/parks-api

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagen Twenty
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: |
            ghcr.io/bridgestudio-mx/crm_sf:${{ github.sha }}
            ghcr.io/bridgestudio-mx/crm_sf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push imagen parks-twenty-service
        uses: docker/build-push-action@v6
        with:
          context: parks-twenty-service
          file: parks-twenty-service/Dockerfile
          push: true
          tags: |
            ghcr.io/bridgestudio-mx/crm_sf-parks:${{ github.sha }}
            ghcr.io/bridgestudio-mx/crm_sf-parks:latest
          cache-from: type=gha,scope=parks-service
          cache-to: type=gha,mode=max,scope=parks-service

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(vars.DEPLOY_HOSTS) }}
    steps:
      - uses: actions/checkout@v4

      - name: Encode deploy files for SSH transfer
        id: encode
        run: |
          {
            echo 'compose<<EOF'
            base64 -w0 deploy/docker-compose.yml
            echo
            echo 'EOF'
            echo 'caddy<<EOF'
            base64 -w0 deploy/Caddyfile
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: SSH al servidor ${{ matrix.host }} — sync + redeploy
        uses: appleboy/ssh-action@v1
        env:
          COMPOSE_FILE: ${{ steps.encode.outputs.compose }}
          CADDY_FILE: ${{ steps.encode.outputs.caddy }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
        with:
          host: ${{ matrix.host }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          command_timeout: 20m
          envs: COMPOSE_FILE,CADDY_FILE,IMAGE_TAG,GHCR_TOKEN,GH_ACTOR,TWENTY_API_KEY
          script: |
            set -e
            cd /opt/twenty
            printf '%s' "$COMPOSE_FILE" | base64 -d > docker-compose.yml
            printf '%s' "$CADDY_FILE" | base64 -d > Caddyfile
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            sed -i "s/^TAG=.*/TAG=${IMAGE_TAG}/" .env
            if ! grep -q '^TWENTY_API_KEY=' .env 2>/dev/null; then
              echo "TWENTY_API_KEY=${TWENTY_API_KEY}" >> .env
            elif [ -n "${TWENTY_API_KEY}" ]; then
              sed -i "s|^TWENTY_API_KEY=.*|TWENTY_API_KEY=${TWENTY_API_KEY}|" .env
            fi
            docker compose pull
            docker compose up -d
            docker compose restart caddy
            docker image prune -f
            sleep 8
            docker compose exec -T parks curl -sf http://localhost:3002/health

  parks-bootstrap:
    needs: deploy
    runs-on: ubuntu-latest
    # Metadata Parks + seed demo (borra DEMO-* previos y recrea).
    # Requiere secret TWENTY_API_KEY (Settings → APIs en parks.bridgehub.mx).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install parks-twenty-service dependencies
        working-directory: parks-twenty-service
        run: npm ci

      - name: Verify TWENTY_API_KEY is configured
        env:
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
          TWENTY_BOOTSTRAP_EMAIL: ${{ secrets.TWENTY_BOOTSTRAP_EMAIL }}
          TWENTY_BOOTSTRAP_PASSWORD: ${{ secrets.TWENTY_BOOTSTRAP_PASSWORD }}
        run: |
          if [ -z "$TWENTY_API_KEY" ]; then
            echo "::error::TWENTY_API_KEY está vacío. Agrégalo en Settings → Secrets → Actions y vuelve a ejecutar el workflow (Re-run jobs)."
            exit 1
          fi
          if [ -z "$TWENTY_BOOTSTRAP_EMAIL" ] || [ -z "$TWENTY_BOOTSTRAP_PASSWORD" ]; then
            echo "::warning::TWENTY_BOOTSTRAP_EMAIL/PASSWORD no configurados — se omitirán assign-roles y workspace-branding."
            echo "::warning::Agrega ambos secrets (admin del workspace con permiso ROLES) para asignar roles demo automáticamente."
          fi

      - name: Bootstrap Parks metadata + demo seed
        working-directory: parks-twenty-service
        timeout-minutes: 15
        env:
          TWENTY_API_URL: https://parks.bridgehub.mx
          TWENTY_WORKSPACE_ORIGIN: https://parks.bridgehub.mx
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
          TWENTY_BOOTSTRAP_EMAIL: ${{ secrets.TWENTY_BOOTSTRAP_EMAIL }}
          TWENTY_BOOTSTRAP_PASSWORD: ${{ secrets.TWENTY_BOOTSTRAP_PASSWORD }}
          TWENTY_WORKSPACE_INVITE_HASH: ${{ secrets.TWENTY_WORKSPACE_INVITE_HASH }}
          RESET_DEMO_SEED: 'true'
          TWENTY_REQUEST_INTERVAL_MS: '700'
        run: npm run bootstrap:production
