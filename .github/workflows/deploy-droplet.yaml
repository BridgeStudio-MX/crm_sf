name: Deploy to droplet

# Despliega en cada push a main. El build pesado (frontend + imagen Docker)
# corre aqui, en los runners de GitHub (con RAM de sobra). El droplet solo
# hace pull de la imagen ya construida y reinicia los contenedores.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagen Twenty
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          build-args: |
            REACT_APP_PARKS_SERVICE_URL=https://parks.bridgehub.mx/parks-api
            VITE_PARKS_SERVICE_URL=https://parks.bridgehub.mx/parks-api
            REACT_APP_GOOGLE_MAPS_API_KEY=${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
          tags: |
            ghcr.io/bridgestudio-mx/crm_sf:${{ github.sha }}
            ghcr.io/bridgestudio-mx/crm_sf:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push imagen parks-twenty-service
        uses: docker/build-push-action@v6
        with:
          context: parks-twenty-service
          file: parks-twenty-service/Dockerfile
          push: true
          tags: |
            ghcr.io/bridgestudio-mx/crm_sf-parks:${{ github.sha }}
            ghcr.io/bridgestudio-mx/crm_sf-parks:latest
          cache-from: type=gha,scope=parks-service
          cache-to: type=gha,mode=max,scope=parks-service

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(vars.DEPLOY_HOSTS) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Sync compose + Caddyfile and redeploy
        env:
          SSHPASS: ${{ secrets.DROPLET_PASSWORD }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_HOST: ${{ matrix.host }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          SSH_OPTS='-o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15'

          for attempt in 1 2 3; do
            echo "SCP attempt ${attempt}..."
            if sshpass -e scp $SSH_OPTS \
              deploy/docker-compose.yml deploy/Caddyfile \
              deploy/rename-charles-el-mann.sql \
              "${DROPLET_USER}@${DROPLET_HOST}:/opt/twenty/"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "SCP failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          sshpass -e ssh $SSH_OPTS "${DROPLET_USER}@${DROPLET_HOST}" \
            "IMAGE_TAG='${IMAGE_TAG}' GHCR_TOKEN='${GHCR_TOKEN}' GH_ACTOR='${GH_ACTOR}' TWENTY_API_KEY='${TWENTY_API_KEY}' GOOGLE_MAPS_API_KEY='${GOOGLE_MAPS_API_KEY}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/twenty
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          sed -i "s/^TAG=.*/TAG=${IMAGE_TAG}/" .env
          if ! grep -q '^TWENTY_API_KEY=' .env 2>/dev/null; then
            echo "TWENTY_API_KEY=${TWENTY_API_KEY}" >> .env
          elif [ -n "${TWENTY_API_KEY}" ]; then
            sed -i "s|^TWENTY_API_KEY=.*|TWENTY_API_KEY=${TWENTY_API_KEY}|" .env
          fi
          if [ -n "${GOOGLE_MAPS_API_KEY}" ]; then
            if ! grep -q '^GOOGLE_MAPS_API_KEY=' .env 2>/dev/null; then
              echo "GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" >> .env
            else
              sed -i "s|^GOOGLE_MAPS_API_KEY=.*|GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}|" .env
            fi
            if ! grep -q '^REACT_APP_GOOGLE_MAPS_API_KEY=' .env 2>/dev/null; then
              echo "REACT_APP_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}" >> .env
            else
              sed -i "s|^REACT_APP_GOOGLE_MAPS_API_KEY=.*|REACT_APP_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}|" .env
            fi
          fi
          docker compose pull
          docker compose up -d
          docker compose restart caddy
          docker image prune -f
          sleep 10
          # Display name only — Charlie Meta → Charles El Mann Metta
          docker compose exec -T db \
            psql -U "${PG_DATABASE_USER:-postgres}" -d default \
            < /opt/twenty/rename-charles-el-mann.sql
          docker compose exec -T parks curl -sf http://localhost:3002/health
          docker compose exec -T parks curl -sf http://localhost:3002/config/public | head -c 80
          REMOTE

  parks-bootstrap:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install parks-twenty-service dependencies
        working-directory: parks-twenty-service
        run: npm ci

      - name: Verify TWENTY_API_KEY is configured
        env:
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
          TWENTY_BOOTSTRAP_EMAIL: ${{ secrets.TWENTY_BOOTSTRAP_EMAIL }}
          TWENTY_BOOTSTRAP_PASSWORD: ${{ secrets.TWENTY_BOOTSTRAP_PASSWORD }}
        run: |
          if [ -z "$TWENTY_API_KEY" ]; then
            echo "::error::TWENTY_API_KEY está vacío. Agrégalo en Settings → Secrets → Actions y vuelve a ejecutar el workflow (Re-run jobs)."
            exit 1
          fi
          if [ -z "$TWENTY_BOOTSTRAP_EMAIL" ] || [ -z "$TWENTY_BOOTSTRAP_PASSWORD" ]; then
            echo "::warning::TWENTY_BOOTSTRAP_EMAIL/PASSWORD no configurados — se omitirán assign-roles y workspace-branding."
          fi

      - name: Bootstrap Parks metadata + demo seed
        working-directory: parks-twenty-service
        timeout-minutes: 15
        env:
          TWENTY_API_URL: https://parks.bridgehub.mx
          TWENTY_WORKSPACE_ORIGIN: https://parks.bridgehub.mx
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
          TWENTY_BOOTSTRAP_EMAIL: ${{ secrets.TWENTY_BOOTSTRAP_EMAIL }}
          TWENTY_BOOTSTRAP_PASSWORD: ${{ secrets.TWENTY_BOOTSTRAP_PASSWORD }}
          TWENTY_WORKSPACE_INVITE_HASH: ${{ secrets.TWENTY_WORKSPACE_INVITE_HASH }}
          RESET_DEMO_SEED: 'true'
          TWENTY_REQUEST_INTERVAL_MS: '700'
        run: npm run bootstrap:production
